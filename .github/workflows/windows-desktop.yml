name: Windows desktop package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact canonical version tag
        required: true
        type: string
      commit:
        description: Full canonical commit SHA
        required: true
        type: string
      channel:
        type: choice
        options: [internal, stable]
        default: internal
      create_draft:
        description: Create a signed draft release after verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-desktop-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/verify-desktop-release-input.mjs
        env:
          BEAVER_RELEASE_TAG: ${{ inputs.tag }}
          BEAVER_RELEASE_COMMIT: ${{ inputs.commit }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:desktop-boundaries
      - run: npm run lint:provider-boundaries
      - run: npm run lint:frontend-boundaries
      - run: npm run lint:ui-language
      - run: npm run lint:ui-styles
      - run: npm test
  package:
    needs: verify
    runs-on: windows-latest
    environment: windows-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/verify-desktop-release-input.mjs
        env:
          BEAVER_RELEASE_TAG: ${{ inputs.tag }}
          BEAVER_RELEASE_COMMIT: ${{ inputs.commit }}
      - run: npm ci
      - name: Build, sign and verify without publishing
        run: npm run package:desktop:win
        env:
          BEAVER_BUILD_CHANNEL: ${{ inputs.channel }}
          BEAVER_PUBLISHER_SUBJECT: ${{ vars.BEAVER_PUBLISHER_SUBJECT }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-desktop-${{ inputs.channel }}
          if-no-files-found: error
          path: |
            release/desktop/${{ inputs.channel }}/*.exe
            release/desktop/${{ inputs.channel }}/*.exe.blockmap
            release/desktop/${{ inputs.channel }}/latest.yml
            dist/desktop/build-info.json
      - name: Create verified draft only
        if: inputs.channel == 'stable' && inputs.create_draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.BEAVER_RELEASE_ENABLED }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          if ($env:RELEASE_ENABLED -ne 'true') { throw 'Production signing and release acceptance are not enabled.' }
          $releaseFiles = Get-ChildItem -LiteralPath release/desktop/stable -File | Where-Object { $_.Name -match '\.exe$|\.exe\.blockmap$|^latest\.yml$' }
          if ($releaseFiles.Count -ne 3) { throw 'Release assets are incomplete.' }
          & gh release create $env:RELEASE_TAG --draft --verify-tag --target $env:RELEASE_COMMIT --title "Beaver Code $env:RELEASE_TAG" --notes "Windows x64" @($releaseFiles.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
