<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beaver Code</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; background: #ecf4f6; color: #17191b; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { display: grid; justify-items: center; gap: 14px; }
      .mark { width: 54px; height: 54px; border-radius: 14px; background: #17191b; position: relative; box-shadow: 0 12px 30px rgb(23 25 27 / 18%); }
      .mark::after { content: ""; position: absolute; left: 11px; right: 11px; bottom: 10px; height: 8px; border-radius: 5px; background: #c96442; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
      p { margin: 0; color: #647178; font-size: 14px; }
      .pulse { width: 120px; height: 3px; overflow: hidden; border-radius: 2px; background: #d6e2e5; }
      .pulse::after { content: ""; display: block; width: 42px; height: 100%; background: #4385d1; animation: load 1.1s ease-in-out infinite alternate; }
      @keyframes load { to { transform: translateX(78px); } }
      @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body><main><div class="mark" aria-hidden="true"></div><h1>Beaver Code</h1><p>正在启动工作台…</p><div class="pulse" aria-hidden="true"></div></main></body>
</html>
